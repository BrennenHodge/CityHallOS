<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Public meetings | City Hall OS</title>
  <meta name="description" content="Upcoming public meetings, agendas and approved minutes.">
  <meta name="theme-color" content="#1f5c46">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #0b1324; --muted: #5e6779; --line: #e6e2d8; --paper: #fbfaf6; --brand: #1f5c46; --soft: #e5efe9; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { font: 15px/1.55 Inter, ui-sans-serif, system-ui, sans-serif; color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; }
    a { color: var(--brand); }
    .top { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: #fff; }
    .top img { width: 30px; height: 30px; }
    .top strong { font-family: "Inter Tight", sans-serif; font-size: 17px; letter-spacing: -.02em; }
    .top strong span { color: #2450e0; }
    .top .city { margin-left: auto; font-size: 13.5px; color: var(--muted); text-align: right; }
    main { max-width: 960px; margin: 0 auto; padding: 28px 24px 48px; }
    h1 { font-family: "Inter Tight", sans-serif; font-size: clamp(28px, 4vw, 40px); line-height: 1.1; letter-spacing: -.03em; margin: 0 0 8px; }
    .lead { color: var(--muted); margin: 0 0 22px; max-width: 640px; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
    .filters button { font: inherit; font-size: 13.5px; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 13px; cursor: pointer; }
    .filters button.on { background: var(--brand); border-color: var(--brand); color: #fff; }
    h2 { font-family: "Inter Tight", sans-serif; font-size: 20px; margin: 26px 0 10px; }
    .m { background: #fff; border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
    .m > button { all: unset; box-sizing: border-box; display: flex; gap: 14px; width: 100%; padding: 14px 16px; cursor: pointer; align-items: center; }
    .m > button:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }
    .d { flex: none; width: 54px; text-align: center; border-radius: 12px; background: var(--soft); color: var(--brand); padding: 6px 0; }
    .d b { display: block; font: 700 21px/1.1 "Inter Tight", sans-serif; } .d small { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
    .m .t { font-weight: 600; } .m .s { color: var(--muted); font-size: 13.5px; }
    .tags { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .tag { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: #f1efe8; color: var(--muted); white-space: nowrap; }
    .tag.ok { background: var(--soft); color: var(--brand); } .tag.no { background: #fde8e6; color: #b42318; }
    .body { border-top: 1px solid var(--line); padding: 6px 20px 18px; display: none; }
    .m.open .body { display: block; }
    .doc h3 { font: 700 18px/1.3 "Inter Tight", sans-serif; margin: 16px 0 6px; } .doc h4 { font-size: 15.5px; margin: 16px 0 4px; } .doc h5 { font-size: 14.5px; margin: 12px 0 4px; }
    .doc p { margin: 6px 0; } .doc ul { margin: 6px 0; padding-left: 20px; }
    .tabs { display: flex; gap: 6px; margin: 12px 0 4px; }
    .tabs button { font: inherit; font-size: 13px; font-weight: 600; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 5px 11px; cursor: pointer; }
    .tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
    .note { font-size: 13px; color: var(--muted); margin-top: 10px; }
    .empty { color: var(--muted); padding: 18px; background: #fff; border: 1px dashed var(--line); border-radius: 14px; }
    .ask { margin-top: 30px; padding: 16px 18px; background: #fff; border: 1px solid var(--line); border-radius: 14px; }
    @media (max-width: 640px) { main { padding: 18px 16px 36px; } .top { padding: 12px 16px; } .tags { display: none; } }
  </style>
</head>
<body>
  <header class="top">
    <img src="/favicon.svg" alt="">
    <strong>City Hall <span>OS</span></strong>
    <div class="city" id="cityName"></div>
  </header>
  <main>
    <h1>Public meetings</h1>
    <p class="lead" id="lead">Agendas for upcoming meetings and approved minutes of past meetings.</p>
    <div class="filters" id="filters"></div>
    <div id="list"><p class="lead">Loading…</p></div>
    <div class="ask" id="ask" hidden></div>
  </main>
  <script src="/meetings-page.js"></script>
</body>
</html>
